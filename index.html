<title>GAME VAULT — PC Game Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0f;
    --panel:#17181b;
    --panel-2:#1c1d21;
    --line:#2a2b30;
    --text:#e9e9ec;
    --muted:#8b8c93;
    --accent:#ff3b30;
    --accent-dim:#7a1c17;
    --accent-2:#ffb400;
    --mono:'Space Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #16100f 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  /* scanline overlay */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:9999;
    mix-blend-mode:overlay;
  }

  a{color:inherit;}
  ::selection{background:var(--accent); color:#0a0e0a;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

  /* ---------- Header ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #0c110b 0%, transparent 100%);
    padding:20px 0 0;
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(6px);
  }
  .brand-row{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap; padding-bottom:18px;
  }
  .brand{
    font-family:var(--mono);
    font-size:28px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--accent);
    text-shadow:0 0 18px rgba(255,59,48,0.35);
    display:flex; align-items:baseline; gap:10px;
  }
  .brand .cursor{
    display:inline-block; width:11px; height:22px; background:var(--accent);
    animation:blink 1.1s steps(2) infinite;
    box-shadow:0 0 10px rgba(255,59,48,0.6);
  }
  @keyframes blink{50%{opacity:0;}}
  .tagline{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    letter-spacing:2px; text-transform:uppercase;
  }
  .stat{
    font-family:var(--mono); font-size:12px; color:var(--muted);
    text-align:right;
  }
  .stat b{color:var(--accent); font-weight:700;}

  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
    padding:14px 0 16px; border-top:1px solid var(--line);
  }
  #search{
    flex:1; min-width:220px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 14px;
    font-family:var(--mono);
    font-size:13px;
    outline:none;
    transition:border-color .15s;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{border-color:var(--accent);}
  .chip{
    font-family:var(--mono); font-size:11px; letter-spacing:0.5px;
    padding:8px 12px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted);
    cursor:pointer; user-select:none;
    text-transform:uppercase;
    transition:all .12s;
  }
  .chip:hover{border-color:var(--accent-dim); color:var(--text);}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}

  /* ---------- Grid ---------- */
  main{padding:32px 0 80px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    cursor:pointer;
    display:flex; flex-direction:column;
    overflow:hidden;
    transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--accent-dim);
    box-shadow:0 10px 30px -12px rgba(0,0,0,0.6);
  }
  .cover{
    aspect-ratio:4/3; position:relative;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .cover .glyph{
    font-family:var(--mono); font-size:42px; font-weight:700;
    color:rgba(255,255,255,0.85);
    text-shadow:0 2px 12px rgba(0,0,0,0.4);
  }
  .cover-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .cover-tint{
    position:absolute; inset:0;
    mix-blend-mode:multiply;
    opacity:0.55;
  }
  .cover-shade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.65) 100%);
  }
  .cover .id-tag{
    position:absolute; top:8px; left:8px;
    font-family:var(--mono); font-size:10px;
    background:rgba(0,0,0,0.55); color:var(--accent);
    padding:3px 6px; letter-spacing:1px;
  }
  .cover .genre-tag{
    position:absolute; bottom:8px; right:8px;
    font-family:var(--mono); font-size:10px;
    background:rgba(0,0,0,0.55); color:#fff;
    padding:3px 6px; text-transform:uppercase; letter-spacing:0.5px;
  }
  .card-body{padding:12px 14px 14px;}
  .card-title{
    font-family:var(--sans); font-weight:700; font-size:13.5px;
    line-height:1.32; margin:0 0 6px;
    color:var(--text);
  }
  .card-meta{
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    display:flex; justify-content:space-between;
  }

  .empty{
    grid-column:1/-1; text-align:center; padding:60px 0;
    font-family:var(--mono); color:var(--muted); font-size:13px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,8,6,0.82);
    backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel-2);
    border:1px solid var(--line);
    max-width:760px; width:100%;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .modal-cover{
    aspect-ratio:16/6.2; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-cover .glyph{
    font-family:var(--mono); font-size:64px; font-weight:700; color:rgba(255,255,255,0.9);
  }
  .modal-close{
    position:absolute; top:12px; right:12px;
    width:32px; height:32px;
    background:rgba(0,0,0,0.55); color:#fff; border:1px solid rgba(255,255,255,0.2);
    font-family:var(--mono); font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .modal-close:hover{background:var(--accent); color:#fff;}
  .modal-body{padding:24px 28px 30px;}
  .modal-eyebrow{
    font-family:var(--mono); font-size:11px; color:var(--accent);
    letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;
  }
  .modal-title{font-size:24px; font-weight:700; margin:0 0 14px; color:var(--text);}
  .modal-desc{font-size:14px; line-height:1.7; color:#c3d3b6; margin-bottom:20px;}
  .spec-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:20px;
  }
  .spec{background:var(--panel); padding:10px 12px;}
  .spec-label{font-family:var(--mono); font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .spec-value{font-family:var(--mono); font-size:13px; color:var(--text); margin-top:2px;}
  .tag-row{display:flex; gap:8px; flex-wrap:wrap;}
  .tag{
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    border:1px solid var(--line); padding:4px 9px;
  }
  .download-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:#fff;
    font-family:var(--mono); font-weight:700; font-size:12.5px;
    letter-spacing:0.5px; text-transform:uppercase;
    padding:10px 18px; border:none;
    text-decoration:none;
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .download-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 22px -8px rgba(255,59,48,0.55);
  }
  .download-btn::after{content:"→"; font-weight:700;}
  .modal-top-row{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:14px;
  }
  .genre-icon{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0.9;
  }
  .genre-icon svg{width:58%; height:58%; max-width:150px; filter:drop-shadow(0 6px 18px rgba(0,0,0,0.45));}
  .cover-grain{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:6px 6px;
    mix-blend-mode:overlay; pointer-events:none;
  }

  footer{
    border-top:1px solid var(--line); padding:26px 0 40px;
    font-family:var(--mono); font-size:11px; color:var(--muted); text-align:center;
  }

  @media (max-width:560px){
    .brand{font-size:22px;}
    .modal-title{font-size:20px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand-row">
      <div>
        <div class="brand">GAME_VAULT<span class="cursor"></span></div>
        <div class="tagline">an archive of pc games</div>
      </div>
      <div class="stat">INDEX SIZE <b id="countStat">100</b> / SHOWING <b id="shownStat">100</b></div>
    </div>
    <div class="toolbar">
      <input id="search" type="text" placeholder="&gt; search the archive..." />
      <div class="chip active" data-genre="all">All</div>
      <div class="chip" data-genre="Action">Action</div>
      <div class="chip" data-genre="RPG">RPG</div>
      <div class="chip" data-genre="Strategy">Strategy</div>
      <div class="chip" data-genre="Simulation">Simulation</div>
      <div class="chip" data-genre="Puzzle">Puzzle</div>
      <div class="chip" data-genre="Horror">Horror</div>
      <div class="chip" data-genre="Racing">Racing</div>
      <div class="chip" data-genre="Roguelike">Roguelike</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer>
  GAME_VAULT — a fan-made catalog for browsing purposes · all titles below are fictional entries generated for this demo
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
  // ---------- Deterministic data generation ----------
  const genres = ["Action","RPG","Strategy","Simulation","Puzzle","Horror","Racing","Roguelike"];
  const platforms = ["Windows","Windows / SteamOS","Windows / macOS","Windows / Linux"];
  const w1 = ["Iron","Shadow","Crimson","Silent","Broken","Wandering","Neon","Frozen","Ashen","Hollow","Copper","Wild","Last","Forgotten","Rusted","Distant","Static","Feral","Amber","Grey"];
  const w2 = ["Reach","Circuit","Kingdom","Horizon","Foundry","Depths","Signal","Garden","Legion","Drift","Archive","Hollow","Basin","Frontier","Engine","Ridge","Colony","Rift","Wake","Marrow"];
  const studios = ["Palefire Studio","Nine Rooks","Copperlight Games","Vale Interactive","Longwatch","Driftwood Co.","Hollow Anvil","Static Field","Brass Compass","Faultline Games"];
  const blurbTemplates = [
    g => `A ${g.toLowerCase()} game about learning the rules of a world that keeps changing them.`,
    g => `Slow-burn ${g.toLowerCase()} with a focus on exploration and consequence.`,
    g => `A tightly-scoped ${g.toLowerCase()} experience built around one strong idea.`,
    g => `Systems-driven ${g.toLowerCase()} where every run tells a different story.`,
    g => `A moody, atmospheric take on the ${g.toLowerCase()} genre.`,
    g => `Fast, punishing, and precise — ${g.toLowerCase()} for players who like a challenge.`,
    g => `A cozy-adjacent ${g.toLowerCase()} title with surprising emotional depth.`,
    g => `Minimalist ${g.toLowerCase()} design with a surprisingly long tail of content.`
  ];
  const longDescTemplates = [
    (t,g) => `${t} drops you into a world that rewards curiosity over speed. As a ${g.toLowerCase()} title, it leans on tight feedback loops and a slowly unfolding setting rather than spectacle. Expect a handful of core systems that interact in ways the game never fully explains — figuring them out is most of the fun.`,
    (t,g) => `Set in a quietly hostile world, ${t} is a ${g.toLowerCase()} game built around a single mechanic pushed to its limits. Runs are short, failure is informative, and the game trusts you to notice patterns on your own.`,
    (t,g) => `${t} is a ${g.toLowerCase()} project with an unusually strong sense of place. The world feels lived-in even when it's mostly empty, and the pacing favors long stretches of quiet punctuated by sharp moments of tension.`,
    (t,g) => `A compact ${g.toLowerCase()} experience, ${t} focuses on one strong hook and refuses to pad it out. Most players finish it in a single sitting and think about it for a lot longer than that.`
  ];

  function slugify(text){
    return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function hashCode(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }

  function coverStyle(id, seed){
    const hue1 = seed % 360;
    const hue2 = (seed * 7 + 140) % 360;
    const hue3 = (seed * 13 + 260) % 360;
    const angle = 20 + (seed % 50);
    return `background:
      linear-gradient(${angle}deg, hsla(${hue3} 80% 45% / 0.28) 0%, transparent 40%),
      radial-gradient(circle at 25% 15%, hsl(${hue1} 75% 30%) 0%, transparent 55%),
      radial-gradient(circle at 80% 85%, hsl(${hue2} 70% 22%) 0%, transparent 60%),
      repeating-linear-gradient(${angle+90}deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 26px),
      linear-gradient(160deg, hsl(${hue1} 45% 12%), hsl(${hue2} 40% 7%));`;
  }

  const genreIcons = {
    Action: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><path d="M14 50 L44 20" stroke-linecap="round"/><path d="M38 14 L50 26 L44 32 L32 20 Z" fill="rgba(255,255,255,0.35)"/><path d="M10 54 L18 46" stroke-linecap="round"/></svg>`,
    RPG: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><path d="M32 8 L52 18 V32 C52 46 42 54 32 58 C22 54 12 46 12 32 V18 Z" fill="rgba(255,255,255,0.15)"/><path d="M32 22 V40 M24 31 H40" stroke-linecap="round"/></svg>`,
    Strategy: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><rect x="10" y="10" width="18" height="18" fill="rgba(255,255,255,0.2)"/><rect x="36" y="36" width="18" height="18" fill="rgba(255,255,255,0.2)"/><path d="M28 28 L36 36" stroke-linecap="round"/></svg>`,
    Simulation: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><circle cx="32" cy="32" r="20" fill="rgba(255,255,255,0.12)"/><path d="M32 12 V32 L44 40" stroke-linecap="round"/></svg>`,
    Puzzle: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><path d="M14 14 H30 V22 C34 20 38 24 34 28 H50 V44 H42 C44 48 40 52 36 48 V44 H14 Z" fill="rgba(255,255,255,0.18)"/></svg>`,
    Horror: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><path d="M20 46 C20 26 44 26 44 46 L44 50 L36 44 L32 50 L28 44 L20 50 Z" fill="rgba(255,255,255,0.15)"/><circle cx="26" cy="34" r="2.5" fill="rgba(255,255,255,0.8)" stroke="none"/><circle cx="38" cy="34" r="2.5" fill="rgba(255,255,255,0.8)" stroke="none"/></svg>`,
    Racing: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><path d="M10 40 L18 24 H46 L54 40" fill="rgba(255,255,255,0.15)"/><circle cx="20" cy="44" r="4"/><circle cx="44" cy="44" r="4"/></svg>`,
    Roguelike: `<svg viewBox="0 0 64 64" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="3"><path d="M32 10 L38 26 L54 26 L41 36 L46 52 L32 42 L18 52 L23 36 L10 26 L26 26 Z" fill="rgba(255,255,255,0.15)"/></svg>`
  };

  function coverHTML(g, big){
    const seedStr = encodeURIComponent(g.title + '-' + g.id);
    const dims = big ? '900/350' : '480/360';
    return `
      <img class="cover-img" src="https://picsum.photos/seed/${seedStr}/${dims}" alt="${g.title} cover art" loading="lazy" />
      <div class="cover-tint" style="${coverStyle(g.id, g.seed)}"></div>
      <div class="cover-shade"></div>
      <div class="genre-icon" style="opacity:0.5;">${genreIcons[g.genre] || ''}</div>
      <span class="id-tag">#${String(g.id).padStart(3,'0')}</span>
      <span class="genre-tag">${g.genre}</span>
    `;
  }

  const games = [];
  for(let i=0;i<100;i++){
    const id = i+1;
    const title = `${w1[i % w1.length]} ${w2[Math.floor(i/w1.length) % w2.length]}`;
    const displayTitle = `${title} — PC Download for MacOS`;
    const slug = slugify(title) + '-free-download';
    const genre = genres[i % genres.length];
    const studio = studios[(i * 3) % studios.length];
    const platform = platforms[i % platforms.length];
    const year = 2016 + (i % 10);
    const seed = hashCode(title + genre);
    const blurb = blurbTemplates[i % blurbTemplates.length](genre);
    const longDesc = longDescTemplates[i % longDescTemplates.length](title, genre);
    const cpu = (i % 2 === 0) ? "Quad-core 2.6GHz" : "Quad-core 3.2GHz";
    const gpu = ["4GB VRAM class","6GB VRAM class","8GB VRAM class"][i % 3];
    const ram = [8,12,16][i % 3];
    const size = 4 + (i % 60);
    games.push({id, title, displayTitle, slug, genre, studio, platform, year, blurb, longDesc, cpu, gpu, ram, size, seed});
  }

  document.getElementById('countStat').textContent = games.length;

  // ---------- Rendering ----------
  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  let activeGenre = 'all';
  let query = '';

  function initials(title){
    return title.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  function render(){
    const filtered = games.filter(g => {
      const matchesGenre = activeGenre === 'all' || g.genre === activeGenre;
      const matchesQuery = g.title.toLowerCase().includes(query) || g.genre.toLowerCase().includes(query) || g.studio.toLowerCase().includes(query);
      return matchesGenre && matchesQuery;
    });
    document.getElementById('shownStat').textContent = filtered.length;

    if(filtered.length === 0){
      grid.innerHTML = `<div class="empty">// no entries match "${query}" —try a different search or genre</div>`;
      return;
    }

    grid.innerHTML = filtered.map(g => `
      <a class="card" href="#${g.slug}" data-id="${g.id}">
        <div class="cover" style="${coverStyle(g.id, g.seed)}">
          ${coverHTML(g, false)}
        </div>
        <div class="card-body">
          <p class="card-title">${g.displayTitle || g.title || 'Untitled Game'}</p>
          <div class="card-meta"><span>${g.studio}</span><span>${g.year}</span></div>
        </div>
      </a>
    `).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        const g = games.find(x => x.id === Number(card.dataset.id));
        if(g) location.hash = g.slug;
      });
    });
  }

  function openPost(id){
    const g = games.find(x => x.id === id);
    if(!g) return;
    modal.innerHTML = `
      <div class="modal-cover" style="${coverStyle(g.id, g.seed)}">
        <div class="modal-close" id="closeBtn">✕</div>
        ${coverHTML(g, true)}
      </div>
      <div class="modal-body">
        <div class="modal-top-row">
          <div>
            <div class="modal-eyebrow">#${String(g.id).padStart(3,'0')} · ${g.genre}</div>
            <h2 class="modal-title">${g.displayTitle || g.title || 'Untitled Game'}</h2>
          </div>
          <a class="download-btn" href="https://getintowin.sbs/free-game/" target="_blank" rel="noopener">Download PC Game</a>
        </div>
        <p class="modal-desc">${g.longDesc}</p>
        <div class="spec-grid">
          <div class="spec"><div class="spec-label">Studio</div><div class="spec-value">${g.studio}</div></div>
          <div class="spec"><div class="spec-label">Release</div><div class="spec-value">${g.year}</div></div>
          <div class="spec"><div class="spec-label">Platform</div><div class="spec-value">${g.platform}</div></div>
          <div class="spec"><div class="spec-label">Download Size</div><div class="spec-value">${g.size} GB</div></div>
          <div class="spec"><div class="spec-label">Min CPU</div><div class="spec-value">${g.cpu}</div></div>
          <div class="spec"><div class="spec-label">Min GPU</div><div class="spec-value">${g.gpu}</div></div>
          <div class="spec"><div class="spec-label">Min RAM</div><div class="spec-value">${g.ram} GB</div></div>
        </div>
        <div class="tag-row">
          <span class="tag">${g.genre}</span>
          <span class="tag">Single-player</span>
          <span class="tag">${g.platform.split(' / ')[0]}</span>
        </div>
      </div>
    `;
    overlay.classList.add('open');
    document.getElementById('closeBtn').addEventListener('click', closePost);
  }

  function closePost(){
    overlay.classList.remove('open');
    if(location.hash) history.pushState('', document.title, location.pathname + location.search);
  }
  overlay.addEventListener('click', e => { if(e.target === overlay) closePost(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closePost(); });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeGenre = chip.dataset.genre;
      render();
    });
  });

  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  function openFromHash(){
    const slug = decodeURIComponent(location.hash.replace('#',''));
    if(!slug){ closePost(); return; }
    const g = games.find(x => x.slug === slug);
    if(g) openPost(g.id);
  }

  window.addEventListener('hashchange', openFromHash);

  render();
  openFromHash();
</script>
</body>
</html>
